<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Dong's Tools App Banner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 90px;
            overflow: hidden;
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .banner {
            width: 100%;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 18px;
            color: #0f172a;
            text-decoration: none;
            border: 1px solid #dbeafe;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 62%, #ecfdf5 100%);
        }
        .content { min-width: 0; }
        .title {
            display: block;
            margin-bottom: 4px;
            color: #1d4ed8;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.2;
        }
        .desc {
            display: block;
            color: #475569;
            font-size: 13px;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cta {
            flex: 0 0 auto;
            padding: 8px 12px;
            border-radius: 6px;
            color: #ffffff;
            background: #2563eb;
            font-size: 13px;
            font-weight: 600;
            line-height: 1;
        }
        @media (max-width: 420px) {
            .banner { padding: 12px; gap: 10px; }
            .title { font-size: 15px; }
            .desc { font-size: 12px; }
            .cta { padding: 8px 10px; }
        }
    </style>
</head>
<body>
    <a class="banner" href="https://dongned.github.io/" target="_blank" rel="noopener">
        <span class="content">
            <span class="title">Dong's Tools</span>
            <span class="desc">获取加班计算器最新版本、使用说明和计算规则</span>
        </span>
        <span class="cta">打开官网</span>
    </a>
</body>
</html>
